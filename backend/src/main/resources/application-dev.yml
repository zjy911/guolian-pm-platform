# 本地开发档：内嵌 H2（MySQL 兼容模式），无需安装 MySQL / Redis 即可跑通全链路。
# 生产请使用 SPRING_PROFILES_ACTIVE=prod + application-prod.yml
spring:
  datasource:
    url: jdbc:h2:mem:pmplatform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/h2/data.sql
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      repositories:
        enabled: false

flowable:
  database-schema-update: true
  async-executor-activate: true
  history-level: audit
  process:
    servlet:
      enabled: false
  # 开发期自动部署 resources/processes 下的 BPMN
  check-process-definitions: true

app:
  jwt:
    # 仅供本地开发使用；生产必须通过环境变量注入
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
  cache:
    type: memory
  debug:
    impersonate-enabled: true

logging:
  level:
    com.guolian.pm: DEBUG
