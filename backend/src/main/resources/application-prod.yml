# 生产档：MySQL 8.0 + Redis。schema 由 sql/01~04 脚本初始化（Flyway 托管可替换 spring.sql.init）。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:pm_platform}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:pm}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 5000
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

flowable:
  database-schema-update: false
  async-executor-activate: true
  history-level: audit
  process:
    servlet:
      enabled: false

app:
  cache:
    type: redis
  debug:
    impersonate-enabled: ${DEBUG_IMPERSONATE_ENABLED:false}

logging:
  level:
    root: INFO
