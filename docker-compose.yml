services:
  mysql:
    image: mysql:8.0
    container_name: pm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-pm_platform}
      MYSQL_USER: ${DB_USER:-pm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pm_change_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${DB_ROOT_PASSWORD:-root_change_me}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pm-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pm-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须注入}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pm_platform}
      DB_USER: ${DB_USER:-pm}
      DB_PASSWORD: ${DB_PASSWORD:-pm_change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      DEBUG_IMPERSONATE_ENABLED: 'false'
      UPLOAD_DIR: /data/uploads
      TZ: Asia/Shanghai
    volumes:
      - upload-data:/data/uploads
    ports:
      - '8080:8080'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8081:80'

volumes:
  mysql-data:
  redis-data:
  upload-data:
